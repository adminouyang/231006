name: udp-ip检测2.1_test版
on:
  schedule:
    - cron: 0 0 */3 * *
  workflow_dispatch:
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Test network connectivity
      run: |
        curl -I --connect-timeout 10 https://tonkiang.us/iptvmulticast.php
        echo "---"
        curl -I --connect-timeout 10 http://tonkiang.us/iptvmulticast.php

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml  # 添加lxml备用

    - name: Run IPTV Crawler with debug
      run: |
        python scripts/iptv_crawler.py --pages 2 --output py/udpxy/iptv_udp_results --debug 2>&1 | tee debug.log

    - name: Upload debug log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-log
        path: debug.log

    - name: List generated files
      run: |
        find . -type f -name "*.txt" -o -name "*.json" | head -20
        echo "---"
        ls -la py/udpxy/iptv_udp_results/ || echo "Directory not found"

    - name: Commit and Push Results
      run: |
        cd $GITHUB_WORKSPACE
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit. Skipping push."
        else
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          git commit -m "更新组播源ip(北京时间: $BEIJING_TIME)"
          git pull --rebase origin main
          git push origin main
        fi
