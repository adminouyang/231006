name: udpxy IP 扫描检测

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "并发数 (HTTP_CONCURRENCY)"
        required: false
        default: "300"
      speed_threshold:
        description: "测速速率阈值 (KB/s)，低于此值丢弃"
        required: false
        default: "300"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: 准备输入文件（若不存在则创建空文件）
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p py/udpxy/template py/udpxy/output py/udpxy/Invalid_ip_file
          [ -f py/udpxy/test_ip.txt ] || touch py/udpxy/test_ip.txt
          [ -f py/udpxy/template/logo.txt ] || touch py/udpxy/template/logo.txt
          [ -f py/udpxy/template/demo.txt ] || touch py/udpxy/template/demo.txt

      - name: 运行扫描脚本
        working-directory: ${{ github.workspace }}
        env:
          HTTP_CONCURRENCY: ${{ github.event.inputs.concurrency || '300' }}
          SPEED_THRESHOLD_KB: ${{ github.event.inputs.speed_threshold || '300' }}
        run: |
          python py/udpxy/udpxy.py

      - name: 汇总输出文件列表
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          echo "===== output/ ====="
          ls -lh py/udpxy/output/ 2>/dev/null || echo "(空)"
          echo "===== 各省 config ====="
          ls -lh py/udpxy/*_config.txt 2>/dev/null || echo "(空)"
          echo "===== 无效记录 ====="
          ls -lh py/udpxy/Invalid_ip_file/ 2>/dev/null || echo "(空)"

      - name: 上传产物 (output / config / invalid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-scan-results-${{ github.run_number }}
          path: |
            py/udpxy/output/
            py/udpxy/*_config.txt
            py/udpxy/Invalid_ip_file/
          retention-days: 30

      - name: 提交结果回仓库
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 只添加扫描结果相关文件，避免误提交其他改动
          git add py/udpxy/output/ py/udpxy/*_config.txt py/udpxy/Invalid_ip_file/ py/udpxy/test_ip.txt || true
          
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          
          git commit -m "chore: 更新 IP 扫描结果 [skip ci]"
          
          # 关键修复：先拉取远端最新提交
          git pull --rebase origin main
          
          # 推送
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
